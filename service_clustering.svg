<svg width="100%" viewBox="0 0 780 700" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Final homelab service clustering</title>
<desc>media-download (arr, qbittorrent, dante) sits independently and feeds video (jellyfin), audiobooks (audiobookshelf), and reading-library (kavita, suwayomi). sandbox (librechat, rclone), smart-home (esphome), and media-sync (syncthing, filebrowser, syncplay, samba) are separate, unrelated clusters.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<g font-family="Anthropic Sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">

<!-- media-download (top, shared infra) -->
<rect x="170" y="40" width="440" height="110" rx="16" stroke-width="0.5" fill="rgb(250,236,231)" stroke="rgb(153,60,29)"/>
<text x="190" y="66" fill="rgb(113,43,19)" font-size="14" font-weight="500">media-download</text>
<text x="190" y="84" fill="rgb(153,60,29)" font-size="12">Shared infra, not domain-owned</text>

<rect x="190" y="100" width="110" height="36" rx="8" stroke-width="0.5" fill="rgb(250,236,231)" stroke="rgb(153,60,29)"/>
<text x="245" y="118" text-anchor="middle" dominant-baseline="central" fill="rgb(113,43,19)" font-size="14" font-weight="500">arr stack</text>

<rect x="335" y="100" width="120" height="36" rx="8" stroke-width="0.5" fill="rgb(250,236,231)" stroke="rgb(153,60,29)"/>
<text x="395" y="118" text-anchor="middle" dominant-baseline="central" fill="rgb(113,43,19)" font-size="14" font-weight="500">qbittorrent</text>

<rect x="490" y="100" width="100" height="36" rx="8" stroke-width="0.5" fill="rgb(250,236,231)" stroke="rgb(153,60,29)"/>
<text x="540" y="118" text-anchor="middle" dominant-baseline="central" fill="rgb(113,43,19)" font-size="14" font-weight="500">dante</text>

<!-- video -->
<rect x="20" y="230" width="220" height="90" rx="16" stroke-width="0.5" fill="rgb(225,245,238)" stroke="rgb(15,110,86)"/>
<text x="40" y="256" fill="rgb(8,80,65)" font-size="14" font-weight="500">video</text>
<rect x="40" y="270" width="180" height="36" rx="8" stroke-width="0.5" fill="rgb(225,245,238)" stroke="rgb(15,110,86)"/>
<text x="130" y="288" text-anchor="middle" dominant-baseline="central" fill="rgb(8,80,65)" font-size="14" font-weight="500">jellyfin</text>

<!-- audiobooks -->
<rect x="280" y="230" width="220" height="90" rx="16" stroke-width="0.5" fill="rgb(224,247,250)" stroke="rgb(0,131,143)"/>
<text x="300" y="256" fill="rgb(0,96,100)" font-size="14" font-weight="500">audiobooks</text>
<rect x="300" y="270" width="180" height="36" rx="8" stroke-width="0.5" fill="rgb(224,247,250)" stroke="rgb(0,131,143)"/>
<text x="390" y="288" text-anchor="middle" dominant-baseline="central" fill="rgb(0,96,100)" font-size="14" font-weight="500">audiobookshelf</text>

<!-- reading-library -->
<rect x="540" y="230" width="220" height="90" rx="16" stroke-width="0.5" fill="rgb(238,237,254)" stroke="rgb(83,74,183)"/>
<text x="560" y="256" fill="rgb(60,52,137)" font-size="14" font-weight="500">reading-library</text>
<rect x="560" y="270" width="90" height="36" rx="8" stroke-width="0.5" fill="rgb(238,237,254)" stroke="rgb(83,74,183)"/>
<text x="605" y="288" text-anchor="middle" dominant-baseline="central" fill="rgb(60,52,137)" font-size="14" font-weight="500">kavita</text>
<rect x="660" y="270" width="90" height="36" rx="8" stroke-width="0.5" fill="rgb(238,237,254)" stroke="rgb(83,74,183)"/>
<text x="705" y="288" text-anchor="middle" dominant-baseline="central" fill="rgb(60,52,137)" font-size="14" font-weight="500">suwayomi</text>

<!-- arrows from media-download down to the three fed clusters -->
<path d="M245 150 L130 230" fill="none" marker-end="url(#arrow)" stroke="rgb(137,135,129)" stroke-width="1.5"/>
<path d="M395 150 L390 230" fill="none" marker-end="url(#arrow)" stroke="rgb(137,135,129)" stroke-width="1.5"/>
<path d="M540 150 L650 230" fill="none" marker-end="url(#arrow)" stroke="rgb(137,135,129)" stroke-width="1.5"/>

<text x="50" y="205" fill="rgb(82,81,78)" font-size="12">media_download network</text>
<text x="315" y="205" fill="rgb(82,81,78)" font-size="12">media_download network</text>
<text x="560" y="205" fill="rgb(82,81,78)" font-size="12">media_download network (FlareSolverr)</text>

<!-- sandbox -->
<rect x="20" y="400" width="220" height="90" rx="16" stroke-width="0.5" fill="rgb(230,241,251)" stroke="rgb(24,95,165)"/>
<text x="40" y="426" fill="rgb(12,68,124)" font-size="14" font-weight="500">sandbox</text>
<text x="40" y="444" fill="rgb(24,95,165)" font-size="12">Independent, no shared deps</text>
<rect x="40" y="450" width="80" height="30" rx="8" stroke-width="0.5" fill="rgb(230,241,251)" stroke="rgb(24,95,165)"/>
<text x="80" y="465" text-anchor="middle" dominant-baseline="central" fill="rgb(12,68,124)" font-size="14" font-weight="500">librechat</text>
<rect x="130" y="450" width="80" height="30" rx="8" stroke-width="0.5" fill="rgb(230,241,251)" stroke="rgb(24,95,165)"/>
<text x="170" y="465" text-anchor="middle" dominant-baseline="central" fill="rgb(12,68,124)" font-size="14" font-weight="500">rclone</text>

<!-- smart-home -->
<rect x="540" y="400" width="220" height="90" rx="16" stroke-width="0.5" fill="rgb(241,239,232)" stroke="rgb(95,94,90)"/>
<text x="560" y="426" fill="rgb(68,68,65)" font-size="14" font-weight="500">smart-home</text>
<text x="560" y="444" fill="rgb(95,94,90)" font-size="12">Independent, no shared deps</text>
<rect x="560" y="450" width="100" height="30" rx="8" stroke-width="0.5" fill="rgb(241,239,232)" stroke="rgb(95,94,90)"/>
<text x="610" y="465" text-anchor="middle" dominant-baseline="central" fill="rgb(68,68,65)" font-size="14" font-weight="500">esphome</text>

<!-- media-sync -->
<rect x="190" y="510" width="400" height="170" rx="16" stroke-width="0.5" fill="rgb(254,246,224)" stroke="rgb(161,98,7)"/>
<text x="210" y="536" fill="rgb(120,53,15)" font-size="14" font-weight="500">media-sync</text>
<text x="210" y="554" fill="rgb(161,98,7)" font-size="12">Independent, no shared deps</text>
<rect x="210" y="572" width="170" height="36" rx="8" stroke-width="0.5" fill="rgb(254,246,224)" stroke="rgb(161,98,7)"/>
<text x="295" y="590" text-anchor="middle" dominant-baseline="central" fill="rgb(120,53,15)" font-size="14" font-weight="500">syncthing</text>
<rect x="400" y="572" width="170" height="36" rx="8" stroke-width="0.5" fill="rgb(254,246,224)" stroke="rgb(161,98,7)"/>
<text x="485" y="590" text-anchor="middle" dominant-baseline="central" fill="rgb(120,53,15)" font-size="14" font-weight="500">filebrowser</text>
<rect x="210" y="620" width="170" height="36" rx="8" stroke-width="0.5" fill="rgb(254,246,224)" stroke="rgb(161,98,7)"/>
<text x="295" y="638" text-anchor="middle" dominant-baseline="central" fill="rgb(120,53,15)" font-size="14" font-weight="500">syncplay</text>
<rect x="400" y="620" width="170" height="36" rx="8" stroke-width="0.5" fill="rgb(254,246,224)" stroke="rgb(161,98,7)"/>
<text x="485" y="638" text-anchor="middle" dominant-baseline="central" fill="rgb(120,53,15)" font-size="14" font-weight="500">samba</text>

</g>
</svg>
