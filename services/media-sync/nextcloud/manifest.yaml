apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nextcloud
  namespace: media-sync
spec:
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      nodeSelector:
        media-sync: "true"
      containers:
      - name: nextcloud
        image: lscr.io/linuxserver/nextcloud:latest
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        ports:
        - containerPort: 80
          hostPort: 8082
        volumeMounts:
        - name: config
          mountPath: /config
        - name: data
          mountPath: /data
        - name: cloud
          mountPath: /cloud
      - name: postgres
        image: postgres:17-alpine
        args: ["-c", "listen_addresses=localhost"]
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        env:
        - name: POSTGRES_USER
          value: nextcloud
        - name: POSTGRES_DB
          value: nextcloud
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        envFrom:
        - secretRef:
            name: nextcloud-db-credentials
        volumeMounts:
        - name: db
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: config
        hostPath:
          path: /opt/appdata/nextcloud/config
      - name: data
        hostPath:
          path: /opt/appdata/nextcloud/data
      - name: db
        hostPath:
          path: /opt/appdata/nextcloud/db
      - name: cloud
        hostPath:
          path: /mnt/media/cloud
          type: Directory
  updateStrategy:
    type: RollingUpdate
