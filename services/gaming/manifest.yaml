# =============================================================================
# Single Pod, 4 containers (xorg, pulseaudio, sunshine, steam) sharing X11 and
# audio sockets via hostPath volumes. Kubernetes requires all containers in a
# Pod to live in one Deployment object — this can't be split across files
# without introducing Kustomize overlays that wouldn't reflect real config
# divergence (see repo convention: Kustomize only where node specs genuinely
# differ). Pinned to nat-server via nodeSelector since it's the only node
# with a GPU.
#
# pulse-audio-config ConfigMap lives in platform/bootstrap/ (shared plumbing,
# applied once, not gaming-specific).
#
# Non-secret env vars for sunshine + steam are injected via envFrom from the
# gaming-env ConfigMap (generated from the committed gaming.env):
#   kubectl create configmap gaming-env --namespace gaming --from-env-file=gaming.env
#
# SUNSHINE_PASS is injected via envFrom from a Secret, created imperatively
# and never committed:
#   kubectl create secret generic sunshine-creds --namespace gaming --from-literal=SUNSHINE_PASS=<value>
#
# nvidia-device-override ConfigMap forces the NVIDIA driver to treat DFP-0 as
# connected and serve a 1920x1080 MetaMode on this headless GPU (no physical
# display attached, so xrandr's usual detection + --newmode/--addmode never
# picks anything up — NVIDIA doesn't support dynamic mode-adding via xrandr
# the way open-source drivers do). Mounted alongside GOW's own 10-nvidia.conf
# as a second .conf file (Xorg merges all of xorg.conf.d/*.conf), rather than
# editing 10-nvidia.conf directly — that file is bind-mounted read-only from
# the host's own filesystem by /ensure-nvidia-xorg-driver.sh at startup, so it
# can't be edited in-place from inside the container.
#   kubectl create configmap nvidia-device-override --namespace gaming --from-file=nvidia-device-override.conf
#
# dshm is an emptyDir (tmpfs) mounted at /dev/shm in the steam container.
# The default container /dev/shm is 64M, which is too small for Chromium's
# GPU process (Steam's UI, including Big Picture Mode, is CEF-based) to
# allocate its shared-memory command buffers — this silently failed with
# "Buffer Handle is null" / "AllocateRingBuffer() failed" in chrome_debug.log
# and was the actual root cause of Steam's window rendering at 64x24
# regardless of the underlying X11 resolution being correct.
#
# xorg is pinned back to gameonwhales/xorg:latest (Docker Hub) after a
# same-session attempt to switch to ghcr.io/games-on-whales/xorg:master —
# that image uses a different, newer s6-overlay-based init system
# (cont-init.d scripts) that tries to populate /usr/share/egl/... at
# startup and fails outright against our current read-only, hostPath-mounted
# driver-file approach. Not a quick fix; xorg was never actually broken
# (fully working at 1920x1080 on the old image via nvidia-device-override),
# so reverted rather than debugging two things in the same session.
# TODO: eventually give xorg the same custom-build treatment as steam and
# sunshine — Docker Hub's copy is 1+ year stale and frozen on EOL Ubuntu
# 21.04 (hirsute), so it can't have packages installed for debugging either.
#
# sunshine is a custom-built image (services/gaming/sunshine-native/Dockerfile)
# for the same reason steam got one: gameonwhales/sunshine:latest is also
# Docker-Hub-frozen, resolving to Sunshine 0.8.1 — a build old enough to
# predate the modern KMS/NVFBC/X11 capture abstraction. On this headless
# NVIDIA setup, 0.8.1's plain X11 capture returned blank frames for
# GL-composited content (Steam's CEF UI), causing a black Moonlight stream
# despite the display rendering correctly (confirmed via glxgears/glxinfo).
# Built from the official LizardByte .deb release matched to nat-server's
# host OS. Unlike GOW's image, this one has no startup.sh translating env
# vars into sunshine.conf — it reads the existing persisted
# /home/retro/sunshine/sunshine.conf directly (passed explicitly via args,
# since the custom image's ENTRYPOINT has no default config lookup).
#
# All three ConfigMaps + the Secret must exist in the gaming namespace before
# this Deployment is applied.
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: steam
  namespace: gaming
  labels:
    app.kubernetes.io/instance: steam
    app.kubernetes.io/name: steam
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: steam
      app.kubernetes.io/name: steam
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: steam
        app.kubernetes.io/name: steam
    spec:
      nodeSelector:
        gpu: nvidia-gtx1060
      runtimeClassName: nvidia
      hostNetwork: true

      # -----------------------------------------------------------------------
      # Shared volumes — X11 socket, audio socket, input devices, game library
      # -----------------------------------------------------------------------
      volumes:
        - name: dev-input
          hostPath:
            path: /dev/input
        - name: uinput
          hostPath:
            path: /dev/uinput
        - name: udev
          hostPath:
            path: /run/udev
        - name: xorg
          hostPath:
            path: /tmp/.X11-unix
        - name: var-log
          hostPath:
            path: /var/log
        - name: audio-socket
          hostPath:
            path: /tmp/pulse
        - name: dri
          hostPath:
            path: /dev/dri
        - name: nvidia-driver
          hostPath:
            path: /opt/gow-nvidia-driver
        - name: steam-home
          hostPath:
            path: /mnt/media/steam
        - name: pulse-conf
          configMap:
            name: pulse-audio-config
            items:
              - key: default.pa
                path: default.pa
              - key: client.conf
                path: client.conf
              - key: daemon.conf
                path: daemon.conf
        - name: nvidia-override
          configMap:
            name: nvidia-device-override
            items:
              - key: nvidia-device-override.conf
                path: 15-nvidia-override.conf
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi

      # -----------------------------------------------------------------------
      # Init: create home dirs on the hostPath volume with correct ownership
      # -----------------------------------------------------------------------
      initContainers:
        - name: mk-steam-home-dirs
          image: busybox:1.31.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - mkdir -p /steam-home/sunshine && chown 1000:1000 /steam-home/sunshine && mkdir -p /steam-home/steam && chown 1000:1000 /steam-home/steam
          volumeMounts:
            - name: steam-home
              mountPath: /steam-home

      containers:

        # ===========================================================================
        # xorg — virtual display server. Everything else renders against DISPLAY=:99
        # ===========================================================================
        - name: xorg
          image: gameonwhales/xorg:latest
          securityContext:
            privileged: true
          envFrom:
            - configMapRef:
                name: gaming-env
          env:
            - name: DISPLAY
              value: ":99"
            - name: REFRESH_RATE
              value: "60"
            - name: RESOLUTION
              value: "1920x1080"
          volumeMounts:
            - name: dev-input
              mountPath: /dev/input
              readOnly: true
            - name: udev
              mountPath: /run/udev
              readOnly: true
            - name: xorg
              mountPath: /tmp/.X11-unix
            - name: var-log
              mountPath: /var/log
            - name: dri
              mountPath: /dev/dri
            - name: nvidia-driver
              mountPath: /usr/nvidia
            - name: nvidia-override
              mountPath: /usr/share/X11/xorg.conf.d/15-nvidia-override.conf
              subPath: 15-nvidia-override.conf

        # ===========================================================================
        # pulseaudio — virtual audio sink, shared over a unix socket
        # ===========================================================================
        - name: pulseaudio
          image: gameonwhales/pulseaudio:latest
          volumeMounts:
            - name: audio-socket
              mountPath: /tmp/pulse
            - name: pulse-conf
              mountPath: /etc/pulse

        # ===========================================================================
        # sunshine — captures the xorg display + pulseaudio sink, encodes via
        # NVENC, hosts the Moonlight-compatible streaming endpoint.
        # Custom-built image (services/gaming/sunshine-native/Dockerfile) —
        # see header comment for why. args points it at the config file
        # already persisted on the steam-home hostPath volume from prior GOW
        # runs; this image's ENTRYPOINT is bare `sunshine` with no default
        # config lookup or env-var-to-config translation.
        # ===========================================================================
        - name: sunshine
          image: yvchenko/sunshine-native:latest
          args:
            - /home/retro/sunshine/sunshine.conf
          securityContext:
            privileged: true
          resources:
            limits:
              nvidia.com/gpu: 1
          env:
            - name: DISPLAY
              value: ":99"
          ports:
            - containerPort: 48010
              protocol: TCP
              hostPort: 48010
            - containerPort: 47984
              protocol: TCP
              hostPort: 47984
            - containerPort: 47985
              protocol: TCP
              hostPort: 47985
            - containerPort: 47986
              protocol: TCP
              hostPort: 47986
            - containerPort: 47987
              protocol: TCP
              hostPort: 47987
            - containerPort: 47988
              protocol: TCP
              hostPort: 47988
            - containerPort: 47989
              protocol: TCP
              hostPort: 47989
            - containerPort: 47990
              protocol: TCP
              hostPort: 47990
            - containerPort: 47998
              protocol: UDP
              hostPort: 47998
            - containerPort: 47999
              protocol: UDP
              hostPort: 47999
            - containerPort: 48000
              protocol: UDP
              hostPort: 48000
          readinessProbe:
            tcpSocket:
              port: 47990
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: gaming-env
            - secretRef:
                name: sunshine-creds
          volumeMounts:
            - name: audio-socket
              mountPath: /tmp/pulse
            - name: udev
              mountPath: /run/udev
              readOnly: true
            - name: xorg
              mountPath: /tmp/.X11-unix
            - name: dri
              mountPath: /dev/dri
            - name: uinput
              mountPath: /dev/uinput
            - name: steam-home
              mountPath: /home/retro/
              subPath: sunshine

        # ===========================================================================
        # steam — custom-built image (services/gaming/steam-native/Dockerfile),
        # matched to nat-server's exact NVIDIA driver version via apt packages
        # rather than GOW's raw driver-file-copy approach, which never got
        # glvnd vendor routing working correctly for the 32-bit client.
        # ===========================================================================
        - name: steam
          image: yvchenko/steam-native:latest
          securityContext:
            privileged: true
          envFrom:
            - configMapRef:
                name: gaming-env
            - secretRef:
                name: sunshine-creds
          env:
            - name: LOG_LEVEL
              value: debug   # overrides gaming-env's LOG_LEVEL=info for this container
          volumeMounts:
            - name: audio-socket
              mountPath: /tmp/pulse
            - name: dev-input
              mountPath: /dev/input
              readOnly: true
            - name: udev
              mountPath: /run/udev
              readOnly: true
            - name: xorg
              mountPath: /tmp/.X11-unix
            - name: dri
              mountPath: /dev/dri
            - name: steam-home
              mountPath: /home/retro/
              subPath: steam
            - name: dshm
              mountPath: /dev/shm