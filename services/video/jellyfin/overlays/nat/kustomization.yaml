resources:
  - ../../base
nameSuffix: "-nat"
patches:
  - target:
      kind: Deployment
      name: jellyfin
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          disk: nat-media
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: JELLYFIN_PublishedServerUrl
            value: http://nat-server.salmon-halfmoon.ts.net:8096