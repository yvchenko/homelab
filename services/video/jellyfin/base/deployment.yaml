apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: video
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      hostNetwork: true
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 100.100.100.100
          - 1.1.1.1
          - 1.0.0.1
        searches:
          - salmon-halfmoon.ts.net
      containers:
      - name: jellyfin
        image: jellyfin/jellyfin:latest
        volumeMounts:
        - name: config
          mountPath: /config
        - name: cache
          mountPath: /cache
        - name: movies
          mountPath: /media/movies
          readOnly: true
        - name: tv
          mountPath: /media/tv
          readOnly: true
      volumes:
      - name: config
        hostPath:
          path: /opt/appdata/jellyfin/config
      - name: cache
        hostPath:
          path: /opt/appdata/jellyfin/cache
      - name: movies
        hostPath:
          path: /mnt/media/movies
      - name: tv
        hostPath:
          path: /mnt/media/tv
  strategy:
    type: Recreate