apiVersion: apps/v1
kind: Deployment
metadata:
  name: esphome
  namespace: smart-home
spec:
  replicas: 1
  selector:
    matchLabels:
      app: esphome
  template:
    metadata:
      labels:
        app: esphome
    spec:
      hostNetwork: true
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 100.100.100.100
          - 1.1.1.1
          - 1.0.0.1
        searches:
          - salmon-halfmoon.ts.net
      nodeSelector:
        disk: kostyan-media
      containers:
      - name: esphome
        image: ghcr.io/esphome/esphome
        securityContext:
          privileged: true
        env:
        - name: ESPHOME_LOG_LEVEL
          value: INFO
        envFrom:
        - secretRef:
            name: esphome-credentials
        volumeMounts:
        - name: config
          mountPath: /config
        - name: localtime
          mountPath: /etc/localtime
          readOnly: true
      volumes:
      - name: config
        hostPath:
          path: /opt/appdata/smart-home
      - name: localtime
        hostPath:
          path: /etc/localtime
  strategy:
    type: Recreate