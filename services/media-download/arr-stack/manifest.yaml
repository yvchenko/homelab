apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: prowlarr
  namespace: media-download
spec:
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      hostNetwork: true
      dnsPolicy: Default
      nodeSelector:
        arr-stack: "true"
      containers:
      - name: prowlarr
        image: lscr.io/linuxserver/prowlarr:latest
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: Europe/Kiev
        volumeMounts:
        - name: config
          mountPath: /config
        - name: custom-indexer
          mountPath: /config/Definitions/Custom/audiobookbay.yml
          readOnly: true
      volumes:
      - name: config
        hostPath:
          path: /opt/appdata/prowlarr
      - name: custom-indexer
        hostPath:
          path: /home/nat/homelab/services/audiobooks/prowlarr-custom/audiobookbay.yml
          type: File
  updateStrategy:
    type: RollingUpdate
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: flaresolverr
  namespace: media-download
spec:
  selector:
    matchLabels:
      app: flaresolverr
  template:
    metadata:
      labels:
        app: flaresolverr
    spec:
      hostNetwork: true
      dnsPolicy: Default
      nodeSelector:
        arr-stack: "true"
      containers:
      - name: flaresolverr
        image: ghcr.io/flaresolverr/flaresolverr:latest
        env:
        - name: LOG_LEVEL
          value: info
        - name: LOG_HTML
          value: "false"
        - name: CAPTCHA_SOLVER
          value: none
        - name: TZ
          value: Europe/Kiev
  updateStrategy:
    type: RollingUpdate