apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: radarr
  namespace: media-download
spec:
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      hostNetwork: true
      dnsPolicy: Default
      nodeSelector:
        arr-stack: "true"
      containers:
      - name: radarr
        image: lscr.io/linuxserver/radarr:latest
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: Europe/Kiev
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /media
      volumes:
      - name: config
        hostPath:
          path: /opt/appdata/radarr
      - name: media
        hostPath:
          path: /mnt/media
  updateStrategy:
    type: RollingUpdate
---
